---
- name: Install NFS client packages
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: yes

- name: Mount NFS shares
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: "{{ nfs_version }}"
    opts: "{{ nfs_mount_opts }}"
    state: mounted
  loop: "{{ nfs_mounts }}"
