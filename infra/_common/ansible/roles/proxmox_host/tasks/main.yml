---
- name: Disable enterprise repos
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^\s*Enabled:\s*true'
    replace: 'Enabled: false'
  loop:
    - /etc/apt/sources.list.d/ceph.sources
    - /etc/apt/sources.list.d/pve-enterprise.sources
  ignore_errors: yes

- name: Write proxmox no-subscription repo
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_distribution_release }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    dest: /etc/apt/sources.list.d/proxmox.sources
    mode: '0644'
    owner: root
    group: root

- name: Remove legacy proxmox sources.list entry
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: 'download.proxmox.com'
    state: absent

- name: Configure network bridge template
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
  notify: Reload networking
