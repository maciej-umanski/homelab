---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: yes

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/debian"
    suites: bookworm
    components: stable
    architectures: amd64
    signed_by: "https://download.docker.com/linux/debian/gpg"
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Create custom Docker data directory
  ansible.builtin.file:
    path: "{{ docker_data_root }}"
    state: directory
    owner: root
    group: root
    mode: '0711'
  when: docker_data_root != '/var/lib/docker'

- name: Configure Docker daemon data-root
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "data-root": "{{ docker_data_root }}"
      }
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker

- name: Create custom containerd data directory
  ansible.builtin.file:
    path: "{{ containerd_data_root }}"
    state: directory
    owner: root
    group: root
    mode: '0711'
  when: containerd_data_root != '/var/lib/containerd'

- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure containerd data root
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: |
      root = "{{ containerd_data_root }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart containerd

- name: Ensure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Ensure '{{ docker_svc_group }}' group exists
  ansible.builtin.group:
    name: "{{ docker_svc_group }}"
    gid: "{{ docker_svc_gid }}"
    state: present

- name: Ensure 'video' group exists
  ansible.builtin.group:
    name: video
    state: present

- name: Ensure 'audio' group exists
  ansible.builtin.group:
    name: audio
    state: present

- name: Ensure '{{ docker_svc_user }}' user exists
  ansible.builtin.user:
    name: "{{ docker_svc_user }}"
    uid: "{{ docker_svc_uid }}"
    group: "{{ docker_svc_group }}"
    groups:
      - docker
      - video
      - audio
    shell: /bin/bash
    create_home: yes
    system: yes
    state: present

- name: Ensure /opt/docker exists
  ansible.builtin.file:
    path: /opt/docker
    state: directory
    owner: "{{ docker_svc_user }}"
    group: "{{ docker_svc_group }}"
    mode: '0755'

- name: Set compose env vars for {{ docker_svc_user }}
  ansible.builtin.blockinfile:
    path: "/home/{{ docker_svc_user }}/.profile"
    block: |
      {% for key, value in docker_env_vars.items() %}
      export {{ key }}={{ value }}
      {% endfor %}
    marker: "# {mark} ANSIBLE MANAGED - docker env"
    owner: "{{ docker_svc_user }}"
    group: "{{ docker_svc_group }}"
    mode: '0644'
    create: yes
  when: docker_env_vars is defined and docker_env_vars | length > 0

- name: Add docker aliases for {{ docker_svc_user }}
  ansible.builtin.blockinfile:
    path: "/home/{{ docker_svc_user }}/.profile"
    block: |
      alias docker-up='docker compose up -d'
      alias docker-down='docker compose down'
      alias docker-dir='cd /opt/docker'
    marker: "# {mark} ANSIBLE MANAGED - docker aliases"
    owner: "{{ docker_svc_user }}"
    group: "{{ docker_svc_group }}"
    mode: '0644'
    create: yes
