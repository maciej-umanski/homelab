---
- name: Provision Stage
  hosts: srv-stage-01
  become: yes

  vars:
    disk_mounts:
      - { src: "/dev/sdb1", path: "/mnt/ssd", fstype: ext4, opts: "defaults,noatime" }
      - { src: "nas-core-01.home.arpa:/vault", path: "/mnt/vault", fstype: nfs4, opts: "rw,noatime" }
      - { src: "nas-core-01.home.arpa:/media", path: "/mnt/media", fstype: nfs4, opts: "rw,noatime" }
    apt_packages:
      - vim
      - cockpit
      - tuned
      - pcp
      - alsa-utils
      - nfs-common
      - radeontop
    docker_data_root: /mnt/ssd/var/docker
    containerd_data_root: /mnt/ssd/var/containerd
    docker_env_vars:
      CONFIG_ROOT: /mnt/ssd/config
      MEDIA_ROOT: /mnt/ssd/media
      VAULT_ROOT: /mnt/vault
      EXTERNAL_MEDIA_ROOT: /mnt/media

  roles:
    - secure_ssh
    - docker_host

  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present
        update_cache: yes

    - name: Mount disks
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ item.opts }}"
        state: mounted
      loop: "{{ disk_mounts }}"

    - name: Unmute and configure audio output
      ansible.builtin.command:
        cmd: "amixer -c 1 set {{ item.name }} {{ item.value }}"
      loop:
        - { name: Master, value: "80% unmute" }
        - { name: Headphone, value: unmute }
        - { name: Speaker, value: unmute }

    - name: Enable amdgpu driver for Kabini GPU
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="amdgpu.cik_support=1 radeon.si_support=0 radeon.cik_support=0"'
        state: present
      notify: Update grub

  handlers:
    - name: Update grub
      ansible.builtin.command:
        cmd: update-grub
      notify: reboot

    - name: reboot
      ansible.builtin.reboot:
        reboot_timeout: 300
