---
- name: Provision Core
  hosts: srv-core-01
  become: yes

  vars:
    nfs_mounts:
      - { src: "nas-core-01.home.arpa:/vault", path: "/mnt/vault" }
      - { src: "nas-core-01.home.arpa:/media", path: "/mnt/media" }
    docker_env_vars:
      CONFIG_ROOT: /mnt/usb/config
      MEDIA_ROOT: /mnt/usb/media
      VAULT_ROOT: /mnt/vault
      EXTERNAL_MEDIA_ROOT: /mnt/media

  roles:
    - secure_ssh
    - nfs_client
    - docker_host

  tasks:
    - name: Mount USB SSD for configs
      ansible.posix.mount:
        src: "/dev/sdb1"
        path: "/mnt/usb"
        fstype: ext4
        opts: defaults,noatime
        state: mounted

    - name: Install alsa-utils
      ansible.builtin.apt:
        name: alsa-utils
        state: present

    - name: Unmute and configure audio output
      ansible.builtin.command:
        cmd: "amixer -c 1 set {{ item.name }} {{ item.value }}"
      loop:
        - { name: Master, value: "80% unmute" }
        - { name: Headphone, value: unmute }
        - { name: Speaker, value: unmute }
