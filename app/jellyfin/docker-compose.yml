services:

  jellyfin:
    container_name: jellyfin
    image: ghcr.io/hotio/jellyfin:release-10.11.11
    restart: unless-stopped
    group_add:
      - 44
    environment:
      - PUID=1005
      - PGID=1005
      - UMASK=002
      - TZ=Europe/Warsaw
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${MEDIA_ROOT}:/data
      - ${EXTERNAL_MEDIA_ROOT}:/external
    ports:
      - "8096:8096"