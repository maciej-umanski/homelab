services:

  shairport-sync:
    image: mikebrady/shairport-sync
    container_name: shaiport-sync
    network_mode: host
    restart: unless-stopped
    devices:
      - /dev/snd:/dev/snd
    command:
      - "-a"
      - "Panasonic SC-PMX90"
      - "--"
      - "-d"
      - "plughw:1,0"
      - "-c"
      - "Master"
